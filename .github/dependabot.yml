version: 2
updates:
  # Node app dependencies (Fastify, better-sqlite3, jszip, ...).
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions used by the build/release workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Base image + packages in the container Dockerfile.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
